name: Update Dashboard Data

on:
  # Run daily at 8am ET (12pm UTC)
  schedule:
    - cron: '0 12 * * *'
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:
  
  # Allow trigger from API (for dashboard refresh button)
  repository_dispatch:
    types: [refresh-data]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: apps/keeper-advisor
        run: |
          pip install -r requirements.txt
      
      - name: Set up Yahoo OAuth credentials
        run: |
          mkdir -p apps/keeper-advisor/config
          echo '${{ secrets.YAHOO_OAUTH_JSON }}' > apps/keeper-advisor/config/oauth2.json

      - name: Run data export
        working-directory: apps/keeper-advisor
        run: |
          python scripts/export_dashboard_data.py
      
      - name: Commit updated data
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add apps/baseball-dashboard/public/api/*.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Auto-update dashboard data

            Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}"
            git push
          fi
      
      - name: Summary
        run: |
          echo "✅ Dashboard data updated successfully!"
          echo "📊 Files updated:"
          ls -lh apps/baseball-dashboard/public/api/*.json
